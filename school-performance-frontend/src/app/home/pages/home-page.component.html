<div class="home-head">
  <div>
    <h1>{{ greeting() }}</h1>
    <p class="home-date"><app-ui-icon name="today"></app-ui-icon> {{ today | appDate }} @if (roleLine()) { <span class="sep">·</span> {{ roleLine() }} }</p>
  </div>
</div>

@if (showStats) {
  <app-home-stats [stats]="stats" [loading]="loading"></app-home-stats>
}

@if (showMyDay) {
  <section class="home-section"><app-home-my-day></app-home-my-day></section>
}

@if ('calendar.view' | hasPermission) {
  <section class="home-section"><app-dashboard-calendar></app-dashboard-calendar></section>
}

@if (showLists) {
  <section class="home-section"><app-home-lists [stats]="stats"></app-home-lists></section>
}
