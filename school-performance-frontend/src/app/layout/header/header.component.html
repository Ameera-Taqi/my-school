<header class="app-header">
  <div class="header-start">
    <button mat-icon-button type="button" class="menu-btn hide-desktop-960" (click)="layout.toggleDrawer()" [attr.aria-label]="'menu.openNav' | translate">
      <app-ui-icon name="menu"></app-ui-icon>
    </button>
    <div class="header-titles">
      <h2 class="header-title">
        <span>{{ 'menu.dashboardTitle' | translate }}</span>
        <span class="term-chip">{{ 'menu.termChip' | translate }}</span>
      </h2>
      <p class="header-subtitle">{{ 'menu.dashboardSubtitle' | translate }}</p>
    </div>
  </div>

  <div class="header-actions">
    <button
      type="button"
      class="action-btn lang-btn"
      (click)="onLanguageToggle(!langService.isEnglish())"
      [attr.aria-label]="'menu.language' | translate">
      <app-ui-icon name="public"></app-ui-icon>
      <span>{{ langService.isEnglish() ? ('menu.lang.ar' | translate) : ('menu.lang.en' | translate) }}</span>
    </button>

    @if (canViewAlerts()) {
      <a
        routerLink="/alerts"
        class="action-btn icon-only"
        [attr.aria-label]="'nav.alerts' | translate"
        [matTooltip]="'nav.alerts' | translate">
        <app-ui-icon name="notifications"></app-ui-icon>
        @if (alertsBadge()) {
          <span class="notif-dot" aria-hidden="true"></span>
        }
      </a>
    }

    <button
      type="button"
      class="user-trigger"
      [matMenuTriggerFor]="userMenu"
      [attr.aria-label]="'menu.greeting' | translate">
      <span class="user-avatar">{{ initials() }}</span>
      <span class="user-trigger-info">
        <span class="user-name">{{ greetingLine() }}</span>
        <span class="user-role">{{ roleLine() }}</span>
      </span>
      <app-ui-icon name="expand_more" class="chevron"></app-ui-icon>
    </button>

    <mat-menu #userMenu="matMenu" panelClass="user-menu-panel" [xPosition]="menuPosition()">
      <div class="menu-profile" (click)="$event.stopPropagation()">
        <span class="menu-profile-greeting">{{ 'menu.greeting' | translate }}</span>
        <span class="menu-profile-name">{{ fullName() }}</span>
        <span class="menu-profile-role">{{ roleLine() }}</span>
      </div>

      <mat-divider></mat-divider>

      <button mat-menu-item type="button" (click)="goToDashboard()">
        <app-ui-icon name="dashboard"></app-ui-icon>
        <span>{{ 'menu.dashboard' | translate }}</span>
      </button>

      @if (canOpenSettings()) {
        <a mat-menu-item routerLink="/settings">
          <app-ui-icon name="settings"></app-ui-icon>
          <span>{{ 'menu.settings' | translate }}</span>
        </a>
      }

      <mat-divider></mat-divider>

      <button mat-menu-item type="button" class="menu-logout" (click)="logout()">
        <app-ui-icon name="logout"></app-ui-icon>
        <span>{{ 'menu.logout' | translate }}</span>
      </button>
    </mat-menu>
  </div>
</header>
