<nav class="sidebar" [class.mini]="mini" aria-label="القائمة الرئيسية">
  <a class="sidebar-brand" routerLink="/home" [matTooltip]="mini ? ('sidebar.brand' | translate) : ''" [matTooltipPosition]="tooltipPosition()">
    <span class="brand-icon"><app-ui-icon name="school"></app-ui-icon></span>
    <span class="brand-text">
      <span class="brand-title">{{ 'sidebar.brand' | translate }}</span>
      <span class="brand-sub">{{ 'sidebar.brandSub' | translate }}</span>
    </span>
  </a>

  <div class="sidebar-scroll">
    @for (section of sections; track section.titleKey) {
      <div class="sidebar-section" [class.open]="isOpen(section)" [class.has-active]="containsActive(section)">
        @if (section.titleKey !== 'section.home') {
        <button type="button" class="section-title" (click)="toggle(section)" [attr.aria-expanded]="isOpen(section)" [disabled]="mini">
          <span class="section-label">{{ section.titleKey | translate }}</span>
          <span class="section-divider"></span>
          <app-ui-icon name="expand_more" class="section-chevron"></app-ui-icon>
        </button>
        }
        <ul [attr.aria-hidden]="!isOpen(section) && !mini">
          @for (item of section.items; track item.route) {
            <li>
              <a [routerLink]="item.route" routerLinkActive="active"
                 [matTooltip]="mini ? (item.labelKey | translate) : ''"
                 [matTooltipPosition]="tooltipPosition()"
                 matTooltipShowDelay="200">
                <app-ui-icon [name]="item.icon"></app-ui-icon>
                <span class="item-label">{{ item.labelKey | translate }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </div>

  <button type="button" class="collapse-btn hide-mobile" (click)="layout.toggleCollapsed()"
          [attr.aria-expanded]="!mini"
          [matTooltip]="mini ? ('sidebar.expand' | translate) : ('sidebar.collapse' | translate)"
          [matTooltipPosition]="tooltipPosition()">
    <app-ui-icon name="angle-double-left"></app-ui-icon>
    <span class="item-label">{{ mini ? ('sidebar.expand' | translate) : ('sidebar.collapse' | translate) }}</span>
  </button>
</nav>
