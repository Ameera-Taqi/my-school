services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: school-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-SchoolPerf2026Strong}
    ports:
      # Connect from SQL Server Management Studio with: localhost,1434  (user: sa)
      - "${MSSQL_HOST_PORT:-1434}:1433"
    volumes:
      - school_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  api:
    build: ./school-performance-api
    container_name: school-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=SchoolPerformance;User Id=sa;Password=${MSSQL_SA_PASSWORD:-SchoolPerf2026Strong};TrustServerCertificate=True;Encrypt=False"
      Jwt__Secret: ${JWT_SECRET:-SchoolPerformanceSmartIndicatorSystemSecretKey2024MustBeLongEnough}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4300,http://127.0.0.1:4200,http://127.0.0.1:4300}
    ports:
      - "8081:8080"
    restart: unless-stopped

  web:
    build: ./school-performance-frontend
    container_name: school-web
    depends_on:
      - api
    ports:
      # Full app (frontend + API behind nginx) at http://localhost:4300
      - "4300:80"
    restart: unless-stopped

volumes:
  school_sqlserver_data:
