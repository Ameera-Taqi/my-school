services:
  # Optional bundled SQL Server (not used when connecting to host SQL on 1433).
  # Start with: docker compose --profile bundled-db up -d sqlserver
  sqlserver:
    profiles: ["bundled-db"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: school-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-SqlServer!2026}
    ports:
      # Only used with profile bundled-db; default local DB is host SQL on 1433
      - "${MSSQL_HOST_PORT:-1433}:1433"
    volumes:
      - school_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  api:
    build: ./school-performance-api
    container_name: school-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Host SQL Server on port 1433 (Mac/Windows/Linux Docker Desktop / host-gateway)
      ConnectionStrings__Default: "Server=${MSSQL_HOST:-host.docker.internal},${MSSQL_HOST_PORT:-1433};Database=SchoolPerformance;User Id=sa;Password=${MSSQL_SA_PASSWORD:-SqlServer!2026};TrustServerCertificate=True;Encrypt=False"
      Jwt__Secret: ${JWT_SECRET:-SchoolPerformanceSmartIndicatorSystemSecretKey2024MustBeLongEnough}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4300,http://127.0.0.1:4200,http://127.0.0.1:4300}
    ports:
      - "8081:8080"
    restart: unless-stopped

  web:
    build: ./school-performance-frontend
    container_name: school-web
    depends_on:
      - api
    ports:
      # Full app (frontend + API behind nginx) at http://localhost:4300
      - "4300:80"
    restart: unless-stopped

volumes:
  school_sqlserver_data:
